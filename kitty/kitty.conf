# ╔══════════════════════════════════════════════════════╗
#                    OUTLAW RICE — KITTY
# ╚══════════════════════════════════════════════════════╝

# Dynamic colors generated from wallpaper
include theme.conf


# ── FONT ────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0


# ── GLASS ───────────────────────────────────────────────

background_opacity 0.82
background_blur    23
dynamic_background_opacity yes

# Slightly more breathing room
window_padding_width 12
window_margin_width  4

placement_strategy center

remember_window_size no
initial_window_width  112c
initial_window_height 32c


# ── CURSOR ──────────────────────────────────────────────

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_stop_blinking_after 15


# ── TERMINAL BEHAVIOR ──────────────────────────────────

enable_audio_bell no
visual_bell_duration 0
bell_on_tab no

confirm_os_window_close 0

scrollback_lines 30000
wheel_scroll_multiplier 3

copy_on_select clipboard
strip_trailing_spaces smart


# ── TABS ────────────────────────────────────────────────

tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "  {index}  {title}  "

active_tab_font_style bold
inactive_tab_font_style normal

tab_bar_margin_width 12
tab_bar_margin_height 8 3


# ── WINDOW ──────────────────────────────────────────────

window_border_width 1px
draw_minimal_borders yes


# ── OVERLAYS ────────────────────────────────────────────

map ctrl+shift+a launch --type=overlay sh -lc '$HOME/outlaw-rice/scripts/kitty-art; read -n 1 -s'

map ctrl+shift+f launch --type=overlay sh -lc '$HOME/outlaw-rice/scripts/outlaw-fetch; read -n 1 -s'
