# Outlaw Rice — Kitty
# Palette is regenerated from the active wallpaper by wallpaperctl/Matugen.
include theme.conf

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

background_opacity 0.86
background_blur    28
dynamic_background_opacity yes

window_padding_width 14
window_margin_width  6
placement_strategy   center
remember_window_size  no
initial_window_width  112c
initial_window_height 32c

cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 15.0

enable_audio_bell no
visual_bell_duration 0.08
bell_on_tab no
confirm_os_window_close 0

scrollback_lines 20000
wheel_scroll_multiplier 3.0
copy_on_select clipboard
strip_trailing_spaces smart

tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_margin_width 8.0
tab_bar_margin_height 6.0 2.0

window_border_width 1px
draw_minimal_borders yes

# The default shell stays clean; run `outlaw-fetch` whenever you want the
# compact system dashboard shown in the reference-style terminal layout.

# Press Ctrl+Shift+A inside Kitty to show your dedicated art image. If no
# ~/.config/kitty/art.png exists, it previews the current wallpaper instead.
map ctrl+shift+a launch --type=overlay sh -lc '$HOME/outlaw-rice/scripts/kitty-art; read -n 1 -s'
map ctrl+shift+f launch --type=overlay sh -lc '$HOME/outlaw-rice/scripts/outlaw-fetch; read -n 1 -s'
