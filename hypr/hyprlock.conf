# ╔══════════════════════════════════════════════════════════╗
# ║                 OUTLAW // HYPRLOCK                      ║
# ╚══════════════════════════════════════════════════════════╝

source = ~/.config/hypr/hyprlock-colors.conf


# ──────────────────────────────────────────────────────────
# GENERAL — real fade in/out on lock & unlock
# ──────────────────────────────────────────────────────────

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}


# ──────────────────────────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────────────────────────

background {
    monitor =
    path = $HOME/.cache/current-wallpaper-image

    blur_passes = 2
    blur_size = 3

    noise = 0.008

    contrast = 1.04
    brightness = 0.78

    vibrancy = 0.08
    vibrancy_darkness = 0.10
}


# ──────────────────────────────────────────────────────────
# SPIDER — legs layer (behind, wider spread, dimmer, shadowed)
# ──────────────────────────────────────────────────────────

label {
    monitor =
    text = ╲   │   ╱
    color = $accent

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1

    position = 0, -180

    halign = center
    valign = center
}

label {
    monitor =
    text = ─   ╳   ─
    color = $accent

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1

    position = 0, -166

    halign = center
    valign = center
}

label {
    monitor =
    text = ╱   │   ╲
    color = $accent

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1

    position = 0, -152

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# SPIDER — body (front, bright, sits centered in the legs)
# ──────────────────────────────────────────────────────────

label {
    monitor =
    text = 🕷
    color = $accent

    font_size = 30
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2

    position = 0, -166

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# ELEGANT TIME
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = $foreground

    font_size = 68
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -98

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# ELEGANT DATE
# ──────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] date '+%A · %d %B'

    color = $foreground_dim

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, -38

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# WEB-FRAME AROUND PASSWORD FIELD
# ──────────────────────────────────────────────────────────

label {
    monitor =
    text = ╌╌╌╌╌╌ ◈ ╌╌╌╌╌╌
    color = $foreground_dim

    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, -10

    halign = center
    valign = center
}

label {
    monitor =
    text = ◤
    color = $accent

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = -168, 8

    halign = center
    valign = center
}

label {
    monitor =
    text = ◥
    color = $accent

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 168, 8

    halign = center
    valign = center
}

label {
    monitor =
    text = ◣
    color = $accent

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = -168, 44

    halign = center
    valign = center
}

label {
    monitor =
    text = ◢
    color = $accent

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 168, 44

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# PASSWORD FIELD — with idle fade + smooth fail flash
# ──────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 320, 50

    outline_thickness = 3

    outer_color = $accent
    inner_color = rgba(10, 8, 8, 0.60)

    rounding = 14

    dots_size = 0.18
    dots_spacing = 0.24
    dots_center = true
    dots_rounding = -1

    font_color = $foreground
    font_family = JetBrainsMono Nerd Font

    # Field dims to half-visibility when idle, and glows back to
    # full opacity the instant you touch a key — the closest thing
    # to a "breathing" transition hyprlock actually supports.
    fade_on_empty = true
    fade_timeout = 1200

    placeholder_text =

    hide_input = false

    check_color = $accent
    fail_color = $error
    fail_transition = 150

    fail_text =

    capslock_color = $error

    position = 0, 26

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────
# BOTTOM STRAND (mirrors top, closes the frame)
# ──────────────────────────────────────────────────────────

label {
    monitor =
    text = ╌╌╌╌╌╌ ◈ ╌╌╌╌╌╌
    color = $foreground_dim

    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, 62

    halign = center
    valign = center
}
