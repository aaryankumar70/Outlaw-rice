# Outlaw Rice — Wuthering Waves-inspired glass lock screen.
# Hyprlock accepts static images only. The stable current-wallpaper symlink is
# the live-wallpaper hook: replace it with a captured animated frame later
# without changing this lock layout.
# Matugen regenerates the palette include after every wallpaper selection.
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = $HOME/.cache/current-wallpaper-image
    blur_passes = 3
    blur_size = 8
    noise = 0.018
    contrast = 1.06
    brightness = 0.78
    vibrancy = 0.16
    vibrancy_darkness = 0.18
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = $foreground
    font_size = 58
    font_family = JetBrainsMono Nerd Font
    position = 72, 170
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = $foreground_dim
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 76, 128
    halign = left
    valign = bottom
}

label {
    monitor =
    text = OUTLAW // UNLOCK
    color = $accent
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 76, 82
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 330, 52
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.24
    dots_center = true
    outer_color = $border
    inner_color = $panel
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <i><span foreground="##b4b8c8">Enter password</span></i>
    hide_input = false
    check_color = $accent
    fail_color = $error
    fail_text = <i>Authentication failed</i>
    position = 72, 28
    halign = left
    valign = bottom
}
